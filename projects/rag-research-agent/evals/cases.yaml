version: 1

defaults:
  top_k: 5
  min_score: 0.0

cases:
  - id: learner_profile_goal
    query: "project owner learning profile RAG research agent"
    expected:
      top_source: learner_profile.md
      expected_sources:
        - learner_profile.md
      min_results: 1
      answerability: supported

  - id: company_business_functions
    query: "Document ingestion semantic retrieval grounded answer generation evaluation monitoring"
    expected:
      expected_sources:
        - nova_insight_company.txt
      min_results: 1
      answerability: supported

  - id: agent_loop_basics
    query: "agent loop observe decide use tools stopping condition"
    expected:
      top_source: agent_basics.md
      expected_sources:
        - agent_basics.md
      min_results: 1
      answerability: supported

  - id: rag_grounding_notes
    query: "retrieval augmented generation grounded citations provided documents"
    expected:
      expected_sources:
        - rag_notes.txt
      min_results: 1
      answerability: supported

  - id: unrelated_stock_price_smoke
    query: "What is Nova Insight Systems stock price?"
    expected:
      # The company document is relevant to the entity, but contains no stock price.
      # This assertion is evaluated only when `eval --answer-eval` is used.
      answerability: unsupported
