[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-agent"
version = "0.1.0"
description = "A small document-grounded RAG research agent with retrieval, citations, and tracing."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=2.7.0",
]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[project.scripts]
rag-research-agent = "rag_research_agent.cli:main"

[tool.setuptools]
packages = ["rag_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]